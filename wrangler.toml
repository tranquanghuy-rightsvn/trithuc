# Cau hinh Cloudflare Worker (Static Assets) cho TrithucWorld - thay the Cloudflare Pages
# (Cloudflare hien gop Pages vao chung mo hinh Workers, khong con luong tao "Pages" rieng
# tren dashboard). Site 100% tinh, khong can Worker script (main) - chi serve thang file
# trong html/. `_redirects`/`_headers` trong html/ van hoat dong dung quy uoc cu cua Pages.
name = "trithuc"
compatibility_date = "2026-08-21"

[assets]
directory = "./html"
# QUAN TRONG - giu nguyen URL co duoi .html (SEO da index tu lau, KHONG duoc doi):
# mac dinh Workers Static Assets dung html_handling = "auto-trailing-slash", se TU DONG
# redirect "/bai-viet.html" -> "/bai-viet" (bo duoi .html) - dung "none" de tat han vi
# nay, serve dung nguyen path nhu file that (giong het cach Vercel/Flask ban goc dang lam).
html_handling = "none"
# Site nhieu trang tinh (khong phai SPA) - khong muon fallback ve index.html cho URL la.
# "404-page": serve dung html/404.html (build.py tu build) kem HTTP status 404 THAT (khac
# SPA fallback tra 200) - tranh Google index nham noi dung trang chu o URL sai.
not_found_handling = "404-page"
