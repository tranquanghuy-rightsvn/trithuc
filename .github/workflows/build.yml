name: Build & deploy TrithucWorld

# Chi trigger o dung file LUON la commit chot cua moi thao tac CMS - khong trigger theo ca
# thu muc data/** (se chay ngay tu commit dau tien/do dang cua 1 thao tac Luu nhieu commit,
# xem static-site-build.md muc 5). 3 file duoi day moi la file chot that su:
#   - data/posts.json    -> chot cua Luu/Xoa bai viet (Code.js ghi SAU CUNG)
#   - data/pages.json    -> chot cua Luu/Xoa trang tinh (khong tach index/detail)
#   - data/website.json  -> chot cua doi cai dat site / danh muc
on:
  push:
    paths:
      - "data/posts.json"
      - "data/pages.json"
      - "data/website.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site tinh (scripts/build.py)
        run: python3 scripts/build.py

      - name: Commit html/ da build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add html/
          git diff --cached --quiet && echo "Khong co thay doi de commit" || git commit -m "CI: build html from data"
          git push

      # Day thang len Cloudflare Pages bang wrangler (direct upload) - KHONG qua co che
      # "git-connected build" cua Cloudflare, nen khong tinh vao quota 500 build/thang
      # (xem hosting-and-quotas.md). Can 2 secret trong repo Settings > Secrets:
      #   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
      # va sua "trithucworld" ben duoi thanh dung ten Cloudflare Pages project cua ban.
      - name: Deploy len Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy html --project-name=trithucworld --branch=main
